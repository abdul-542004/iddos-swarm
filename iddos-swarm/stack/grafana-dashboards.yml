# Grafana provisioning: load any dashboard JSON from /var/lib/grafana/dashboards.
apiVersion: 1
providers:
  - name: iddos
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
