# HAProxy — defence-in-depth reverse proxy (Step 5 optional).
#
# It health-checks the web service on /ready (the READINESS endpoint). When the
# database is slow, /ready returns 503, HAProxy marks the backend DOWN and
# returns 503 to clients immediately — the instance LEAVES the rotation but is
# never killed (Swarm liveness /healthz keeps the container running). When the
# database recovers, /ready returns 200 and HAProxy routes traffic again.

global
    maxconn 512

defaults
    mode http
    timeout connect 2s
    timeout client  5s
    timeout server  5s
    # Active health check: GET /ready, expect HTTP 200.
    option httpchk GET /ready
    http-check expect status 200
    # Check every 2s; mark DOWN after 2 failures, UP after 1 success.
    default-server inter 2s fall 2 rise 1

frontend fe
    bind *:80
    # Expose HAProxy's own stats for the demo.
    stats enable
    stats uri /haproxy-stats
    stats refresh 5s
    default_backend be

backend be
    server web web:8000 check port 8000
